plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingFile = System.getenv("KEYSTORE_FILE")
def signingStorePassword = System.getenv("KEYSTORE_PASSWORD")
def signingAlias = System.getenv("KEY_ALIAS")
def signingKeyPassword = System.getenv("KEY_PASSWORD")
def hasSigning = signingFile && signingStorePassword && signingAlias && signingKeyPassword

android {
    namespace 'com.example.zhixuewear'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.zhixuewear"
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(signingFile)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        compose true
    }

    // Work around an AndroidX lint/Kotlin UAST incompatibility in hosted builds.
    lint {
        disable 'NullSafeMutableLiveData'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'

    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.wear.compose:compose-material3:1.6.2'
    implementation 'androidx.wear.compose:compose-ui-tooling:1.6.2'


    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
