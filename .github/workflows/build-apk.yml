name: Build Wear OS APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android SDK
        run: |
          mkdir -p /usr/local/lib/android/sdk
          cd /usr/local/lib/android/sdk
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools cmdline-tools-latest
          yes | ./cmdline-tools-latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses
          ./cmdline-tools-latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platforms;android-35" "build-tools;35.0.0"
      - name: Run Unit Tests and Assemble Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: body-temperature-wear-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
